<!doctype html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PT TIMER</title>

    <link rel="stylesheet" type="text/css" href="css/default.css">

    <script src="js/jquery.min.js"></script>
    <script src="js/jquery.knob.js"></script>
    <script src="js/jquery.throttle.js"></script>
    <script src="js/jquery.classycountdown.js"></script>
    <script src="title.js"></script>
    <!--classycountdown.js为可修改的自定义脚本-->

    <link rel="stylesheet" type="text/css" href="css/jquery.classycountdown.css" />

    <style>
        :root {
            --bg: #f6f2eb;
            --bg-soft: #efe7dd;
            --panel: #fbf8f2;
            --line: #d2c2ae;
            --line-strong: #a68a6a;
            --text-main: #2e261f;
            --text-soft: #6f5a48;
            --accent: #c07f45;
            --accent-deep: #9a6031;
            --panel-edge: rgba(166, 138, 106, 0.52);
            --panel-shadow: 0 10px 24px rgba(86, 64, 46, 0.11);
            --timer-size: clamp(460px, 68vh, 760px);
            --main-height: 60vh;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            color: var(--text-main);
            background:
                radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0) 38%),
                radial-gradient(circle at 85% 8%, rgba(228, 207, 181, 0.5), rgba(228, 207, 181, 0) 42%),
                linear-gradient(135deg, #f9f5ef 0%, #f3ede4 46%, #eee4d7 100%);
            overflow-x: hidden;
            overflow-y: hidden;
        }

        * {
            box-sizing: border-box;
            font-family: "Trebuchet MS", "Segoe UI", "Arial Black", sans-serif;
            font-weight: 800 !important;
            letter-spacing: 0.02em;
        }

        .app {
            height: calc(100vh - 20px);
            display: grid;
            grid-template-rows: 20vh 60vh 20vh;
            gap: 0;
            padding: clamp(10px, 1.4vw, 16px);
            position: relative;
            margin-bottom: 20px;
        }

        .corner-logo {
            position: absolute;
            top: 10px;
            right: clamp(12px, 1.4vw, 20px);
            z-index: 6;
            width: min(306px, 22.5vw);
            pointer-events: none;
        }

        .corner-logo img {
            width: 100%;
            height: min(clamp(80px, 14vh, 150px), calc(20vh - 20px));
            object-fit: contain;
            object-position: right top;
        }

        .title-section {
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            padding: 10px 0;
            min-height: 0;
            overflow: hidden;
        }

        .title-row {
            display: flex;
            align-items: stretch;
            gap: clamp(8px, 1vw, 14px);
            max-width: calc(100% - min(270px, 20vw));
            flex-wrap: nowrap;
            min-width: 0;
        }

        .title-frame {
            width: fit-content;
            max-width: 58vw;
            border-radius: 22px;
            border: 2px solid var(--line-strong);
            background:
                linear-gradient(130deg, rgba(255, 255, 255, 0.85), rgba(251, 243, 233, 0.9)),
                repeating-linear-gradient(-45deg, rgba(166, 138, 106, 0.06), rgba(166, 138, 106, 0.06) 8px, rgba(255, 255, 255, 0) 8px, rgba(255, 255, 255, 0) 18px);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.8),
                0 12px 30px rgba(82, 61, 43, 0.14);
            padding: clamp(14px, 1.7vw, 20px) clamp(16px, 2vw, 28px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            flex-wrap: nowrap;
            min-height: clamp(80px, 14vh, 150px);
        }

        #output {
            color: var(--text-main);
            user-select: none;
            line-height: 1;
            text-align: center;
            white-space: nowrap;
            text-transform: uppercase;
            font-size: clamp(42px, 5.8vw, 96px);
            text-shadow: 0 2px 0 rgba(255, 255, 255, 0.8);
            padding: 0 clamp(10px, 1.2vw, 18px);
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .top-section-frame {
            max-width: 30vw;
            min-height: clamp(80px, 14vh, 150px);
            padding: clamp(14px, 1.7vw, 20px) clamp(16px, 2vw, 28px);
            border-radius: 22px;
            border: 2px solid var(--line-strong);
            background: linear-gradient(130deg, rgba(255, 255, 255, 0.85), rgba(251, 243, 233, 0.9));
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), 0 12px 30px rgba(82, 61, 43, 0.14);
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            min-width: 0;
        }

        #top-section-name {
            font-size: clamp(42px, 5.8vw, 96px);
            line-height: 1;
            text-transform: uppercase;
            padding: 0 clamp(10px, 1.2vw, 18px);
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #edit-title-btn {
            border: 2px solid var(--line-strong);
            border-radius: 16px;
            background: #e2c9aa;
            color: var(--text-main);
            cursor: pointer;
            text-transform: none;
            padding: 8px 6px;
            width: clamp(56px, 4.6vw, 76px);
            min-height: clamp(80px, 14vh, 150px);
            font-size: clamp(18px, 1.65vw, 26px);
            line-height: 1;
            writing-mode: vertical-rl;
            text-orientation: upright;
            letter-spacing: 0.03em;
            box-shadow: 0 3px 0 rgba(130, 98, 67, 0.45);
            transition: transform 0.14s ease, box-shadow 0.14s ease;
        }

        #edit-title-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 0 rgba(130, 98, 67, 0.45);
        }

        .main-panel {
            min-height: 0;
            height: 100%;
            overflow: hidden;
            display: grid;
            grid-template-columns: minmax(340px, 1.28fr) 16px minmax(240px, 0.9fr) 16px minmax(290px, 1fr);
            gap: clamp(8px, 1vw, 14px);
            align-items: stretch;
        }

        .zone {
            position: relative;
            min-width: 0;
            border-radius: 20px;
            background:
                radial-gradient(circle at 12% 14%, rgba(255, 255, 255, 0.68), rgba(255, 255, 255, 0) 44%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.84), rgba(246, 236, 224, 0.9));
            border: 1px solid var(--panel-edge);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.74), var(--panel-shadow);
            min-height: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .zone-header {
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid rgba(166, 138, 106, 0.36);
            padding: 0 12px;
            min-height: 0;
            height: 15%;
            flex: 0 0 15%;
        }

        .zone-header-label {
            font-size: clamp(24px, 2.4vw, 40px);
            color: var(--text-soft);
            text-transform: uppercase;
            line-height: 1;
            opacity: 0.95;
            text-align: center;
            width: 100%;
        }

        .zone-inner {
            height: 100%;
            min-height: 0;
            flex: 1 1 auto;
        }

        .zone-dial {
            display: grid;
            grid-template-rows: 1fr;
            grid-template-columns: clamp(64px, 15%, 130px) 1fr;
            align-items: center;
            gap: 0;
        }

        .zone-dial .zone-header {
            height: 100%;
            flex: none;
            border-bottom: none;
            border-right: 1px solid rgba(166, 138, 106, 0.36);
            padding: 0 0 0 clamp(2px, 0.4vw, 8px);
            justify-content: flex-start;
        }

        .zone-dial .zone-header-label {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: clamp(38px, 5.1vw, 86px);
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: flex-start;
            width: auto;
            opacity: 0.98;
        }

        .dial-side-name {
            margin-left: clamp(0px, 0.2vw, 4px);
            letter-spacing: 0;
        }

        .timer-panel {
            width: 100%;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: clamp(2px, 0.4vw, 8px);
        }

        .ClassyCountdownDemo {
            width: min(100%, 70%);
            max-width: 100%;
            height: min(70%, var(--timer-size));
            aspect-ratio: 1 / 1;
            margin: 0;
            padding: 0;
            border-radius: 20px;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, rgba(231, 210, 184, 0.25), rgba(231, 210, 184, 0) 70%);
        }

        #countdown1 .ClassyCountdown-wrapper {
            width: 100% !important;
            height: 100% !important;
            position: relative;
        }

        #countdown1 .ClassyCountdown-wrapper>div {
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
        }

        #countdown1 .ClassyCountdown-wrapper .ClassyCountdown-time,
        #countdown1 .ClassyCountdown-wrapper .ClassyCountdown-minutes {
            display: none !important;
        }

        .zone-time {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: clamp(7px, 1.2vh, 12px);
            padding: clamp(8px, 1vw, 12px) clamp(16px, 2vw, 24px);
            text-align: center;
            background:
                radial-gradient(circle at 18% 20%, rgba(216, 184, 147, 0.26), rgba(216, 184, 147, 0) 45%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.62), rgba(247, 239, 229, 0.78));
        }

        .time-left-label {
            color: var(--text-soft);
            font-size: clamp(32px, 3.1vw, 52px);
            line-height: 1.1;
            text-transform: uppercase;
        }

        #time-left-value {
            color: var(--text-main);
            font-size: clamp(54px, min(7.2vw, 11.6vh), 144px);
            line-height: 0.95;
            text-transform: uppercase;
            white-space: nowrap;
            text-shadow: 0 2px 0 rgba(255, 255, 255, 0.9);
            max-width: 100%;
            overflow: hidden;
            text-overflow: clip;
        }

        #time-pause-btn {
            min-width: clamp(120px, 12vw, 190px);
            height: clamp(42px, 5.4vh, 56px);
            border-radius: 12px;
            border: 1px solid var(--line-strong);
            background: #e4caaa;
            color: var(--text-main);
            font-size: clamp(19px, 1.8vw, 30px);
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(130, 98, 67, 0.45);
        }

        #time-pause-btn:hover {
            transform: translateY(-1px);
        }

        .v-separator {
            align-self: stretch;
            width: 100%;
            border-radius: 999px;
            background:
                linear-gradient(180deg, rgba(127, 97, 69, 0) 0%, rgba(127, 97, 69, 0.78) 14%, rgba(127, 97, 69, 0.78) 86%, rgba(127, 97, 69, 0) 100%),
                repeating-linear-gradient(180deg, rgba(242, 229, 212, 0.8), rgba(242, 229, 212, 0.8) 5px, rgba(217, 197, 171, 0.82) 5px, rgba(217, 197, 171, 0.82) 10px);
            box-shadow: 0 0 0 1px rgba(166, 138, 106, 0.28);
        }

        .right-panel {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: center;
            gap: clamp(8px, 1.2vh, 12px);
            padding: clamp(10px, 1.2vw, 14px);
            background:
                radial-gradient(circle at 78% 14%, rgba(209, 171, 129, 0.23), rgba(209, 171, 129, 0) 40%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.62), rgba(247, 239, 229, 0.78));
        }

        .manual-panel {
            width: 100%;
            max-width: 100%;
            border-radius: 14px;
            border: 1px solid var(--line-strong);
            background: #f3e4d2;
            box-shadow: 0 8px 20px rgba(98, 72, 49, 0.16);
            padding: clamp(10px, 1vw, 14px);
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: clamp(6px, 0.8vw, 10px);
        }

        .manual-panel input,
        .manual-panel button {
            width: 100%;
            height: clamp(68px, 10.5vh, 124px);
            aspect-ratio: 1 / 1;
            border-radius: 10px;
            border: 1px solid #b4916f;
            color: var(--text-main);
            background: #fffaf3;
            font-size: clamp(23px, 2.6vw, 38px);
            text-align: center;
            text-transform: uppercase;
            line-height: 0.9;
        }

        .manual-panel input[type="number"] {
            padding-right: 0.22em;
        }

        .manual-panel input[type="number"]::-webkit-outer-spin-button,
        .manual-panel input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: inner-spin-button;
            opacity: 1;
            height: 100%;
            width: 1.42em;
            margin: 0;
            transform: scale(1.28);
            transform-origin: center;
        }

        .manual-panel button {
            cursor: pointer;
            background: #e6cda9;
        }

        .manual-panel button:hover {
            background: #ddb98f;
        }

        .stages {
            min-height: 0;
            height: 100%;
            overflow: hidden;
            display: grid;
            grid-template-columns: repeat(7, minmax(130px, 1fr));
            gap: clamp(6px, 0.8vw, 10px);
            align-items: stretch;
            padding-top: clamp(8px, 1vh, 12px);
            padding-bottom: clamp(8px, 1vh, 12px);
            border-radius: 16px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.42), rgba(245, 233, 217, 0.56));
            border: 1px solid rgba(166, 138, 106, 0.34);
        }

        .stage-btn {
            position: relative;
            min-height: 0;
            height: 100%;
            border-radius: 10px;
            border: 1px solid var(--line-strong);
            background: #e6d0b2;
            color: var(--text-main);
            font-size: clamp(18px, 3.5vh, 34px);
            line-height: 0.85;
            text-align: center;
            padding: 8px 10px;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(95, 71, 49, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .stage-btn::after {
            content: "";
            position: absolute;
            top: 16%;
            right: -8px;
            width: 2px;
            height: 68%;
            border-radius: 99px;
            background: linear-gradient(180deg, rgba(127, 97, 69, 0), rgba(127, 97, 69, 0.95) 20%, rgba(127, 97, 69, 0.95) 80%, rgba(127, 97, 69, 0));
        }

        .stages .stage-btn:last-child::after {
            display: none;
        }

        .stage-btn:hover {
            transform: translateY(-1px);
            background: #dfc39f;
        }

        @media (max-width: 1420px) {
            :root {
                --timer-size: clamp(330px, 52vh, 560px);
            }

            .main-panel {
                grid-template-columns: minmax(320px, 1.2fr) 14px minmax(220px, 0.86fr) 14px minmax(260px, 0.95fr);
            }

            .title-row {
                max-width: calc(100% - min(220px, 18vw));
            }

            .stages {
                grid-template-columns: repeat(5, minmax(120px, 1fr));
            }
        }

        @media (max-width: 1080px) {
            .main-panel {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .app {
                height: auto;
                min-height: 100vh;
                grid-template-rows: auto auto auto;
                margin-bottom: 20px;
            }

            body {
                overflow-y: auto;
            }

            .corner-logo {
                position: static;
                width: min(306px, 67.5vw);
                margin: 0 auto;
                pointer-events: auto;
            }

            .corner-logo img {
                height: min(clamp(88px, 12vh, 130px), calc(20vh - 20px));
                object-position: center top;
            }

            .title-frame {
                width: fit-content;
            }

            .title-row {
                max-width: 100%;
                flex-wrap: wrap;
            }

            #edit-title-btn {
                writing-mode: horizontal-tb;
                text-orientation: mixed;
                width: auto;
                min-height: 44px;
                padding: 8px 14px;
                border-radius: 12px;
                letter-spacing: 0.03em;
                font-size: clamp(14px, 2vw, 18px);
            }

            .v-separator {
                width: 100%;
                height: 12px;
                background:
                    linear-gradient(90deg, rgba(127, 97, 69, 0) 0%, rgba(127, 97, 69, 0.9) 10%, rgba(127, 97, 69, 0.9) 90%, rgba(127, 97, 69, 0) 100%),
                    repeating-linear-gradient(90deg, rgba(242, 229, 212, 0.9), rgba(242, 229, 212, 0.9) 6px, rgba(217, 197, 171, 0.9) 6px, rgba(217, 197, 171, 0.9) 12px);
            }

            .timer-panel {
                width: min(95vw, 540px);
            }

            .zone-dial {
                grid-template-columns: 1fr;
                grid-template-rows: 15% 85%;
            }

            .zone-dial .zone-header {
                justify-content: center;
                border-right: none;
                border-bottom: 1px solid rgba(166, 138, 106, 0.36);
                padding: 0 8px;
            }

            .zone-dial .zone-header-label {
                writing-mode: horizontal-tb;
                font-size: clamp(18px, 4vw, 26px);
                width: 100%;
                justify-content: center;
            }

            #time-left-value {
                font-size: clamp(56px, 13vw, 128px);
            }

            .right-panel {
                flex-direction: column;
                justify-content: center;
            }

            .manual-panel {
                max-width: 440px;
                margin: 0 auto;
            }

            .stages {
                grid-template-columns: repeat(4, minmax(120px, 1fr));
            }
        }

        @media (max-width: 700px) {
            .app {
                padding: 10px;
            }

            .title-frame {
                border-radius: 16px;
            }

            .zone-header-label {
                font-size: clamp(18px, 4vw, 26px);
            }

            #output {
                font-size: clamp(30px, 9vw, 56px);
                white-space: normal;
            }

            .manual-panel {
                grid-template-columns: 1fr;
            }

            .stages {
                grid-template-columns: repeat(2, minmax(130px, 1fr));
            }

            .stage-btn::after {
                display: none;
            }
        }
    </style>

<script src="http://libs.baidu.com/html5shiv/3.7/html5shiv.min.js"></script>
<![endif]-->
</head>

<body>
    <div class="app">
        <div class="corner-logo">
            <img src="NJU.png" alt="NANJING UNIVERSITY" width="178" height="224" />
        </div>

        <header class="title-section">
            <div class="title-row">
                <button id="edit-title-btn" type="button">修改标题</button>
                <div class="title-frame">
                    <div id="output" data-title-file="title.txt"></div>
                </div>
                <div class="top-section-frame">
                    <div id="top-section-name" class="sector-name">READY</div>
                </div>
            </div>
        </header>

        <section class="main-panel">
            <div class="zone zone-dial">
                <div class="zone-header">
                    <span class="zone-header-label sector-name dial-side-name">READY</span>
                </div>
                <div class="zone-inner timer-panel">
                    <div id="countdown1" class="ClassyCountdownDemo" aria-label="Main Countdown Dial"></div>
                </div>
            </div>

            <div class="v-separator" aria-hidden="true"></div>

            <div class="zone zone-time">
                <div class="zone-inner zone-time">
                    <div class="time-left-label">TIME LEFT</div>
                    <div id="time-left-value">00 : 00</div>
                    <button id="time-pause-btn" type="button">PAUSE</button>
                </div>
            </div>

            <div class="v-separator" aria-hidden="true"></div>

            <aside class="zone zone-extra">
                <div class="zone-inner right-panel">
                    <div class="manual-panel">
                        <input type="number" name="minutes" id="min" placeholder="MIN" />
                        <input type="number" name="seconds" id="sec" placeholder="SEC" />
                        <button id="start">START</button>
                        <button id="pause">PAUSE</button>
                        <button id="recover">RECOVER</button>
                        <button id="next">NEXT</button>
                    </div>
                </div>
            </aside>
        </section>

        <section class="stages">
            <button id="bt1" class="stage-btn">选题环节(1')</button>
            <button id="bt2" class="stage-btn">正方准备(2')</button>
            <button id="bt3" class="stage-btn">正方报告(12')</button>
            <button id="bt4" class="stage-btn">反方提问(2')</button>
            <button id="bt5" class="stage-btn">反方准备(2')</button>
            <button id="bt6" class="stage-btn">反方报告(3')</button>
            <button id="bt7" class="stage-btn">正反方讨论(10')</button>
            <button id="bt8" class="stage-btn">评论方提问(3')</button>
            <button id="bt9" class="stage-btn">评论方准备(2')</button>
            <button id="bt10" class="stage-btn">评论方报告(4')</button>
            <button id="bt11" class="stage-btn">正方总结(1')</button>
            <button id="bt12" class="stage-btn">评分(2')</button>
            <button id="bt13" class="stage-btn">裁判点评(5')</button>
        </section>
    </div>

    <audio src="song.mp3" id="audio"></audio>


    <script type="text/javascript">


        var time = 0
        var time1 = 0
        var totaltime = 1
        var backuptime = 0
        var recovertime
        var flag = 0
        var interval
        var items = true
        var num = 0
        var timerBaseColor = "#b98756"

        function setOutputText(rawText) {
            var output = document.getElementById("output");
            if (!output) {
                return;
            }

            var text = (rawText || "").toString().replace(/\r/g, "").replace(/\n+/g, "").replace(/<[^>]+>/g, "").trim();
            if (!text) {
                text = "CUPT交流赛";
            }

            output.textContent = text;
            applyTitleScale(text);
        }

        function loadInitialTitle() {
            var text = window.APP_TITLE_TEXT || "CUPT交流赛";
            setOutputText(text);
        }

        function applyTitleScale(text) {
            var output = document.getElementById("output");
            if (!output) {
                return;
            }

            var length = Array.from(text || "").length;
            var estimate = 104 - Math.max(0, length - 6) * 3;
            var viewportLimit = Math.max(34, Math.floor(window.innerWidth * 0.076));
            var size = Math.max(30, Math.min(estimate, viewportLimit));
            output.style.fontSize = size + "px";
            var topName = document.getElementById("top-section-name");
            if (topName) {
                topName.style.fontSize = size + "px";
            }
        }

        function updateTimeLeftDisplay(totalSeconds) {
            var valueNode = document.getElementById("time-left-value");
            if (!valueNode) {
                return;
            }

            var safeValue = Math.max(0, Number(totalSeconds) || 0);
            var minutes = Math.floor(safeValue / 60);
            var seconds = safeValue % 60;
            valueNode.textContent = (minutes < 10 ? "0" + minutes : minutes) + " : " + (seconds < 10 ? "0" + seconds : seconds);
        }

        function setSectorName(rawText) {
            var text = (rawText || "").toString().replace(/\r/g, "").replace(/\n+/g, "").replace(/<[^>]+>/g, "").trim();
            if (!text) {
                text = "准备阶段";
            }
            $(".sector-name").text(text);
        }

        function setPauseButtonState() {
            var label = items ? "PAUSE" : "START";
            $("#pause").text(label);
            $("#time-pause-btn").text(label);
        }

        function togglePauseState() {
            if (items) {
                clearInterval(interval);
                items = false;
            } else {
                interval = setInterval('single()', 1000);
                items = true;
            }
            setPauseButtonState();
        }

        function applyGaugeBaseColor() {
            $('#countdown1 .ClassyCountdown-wrapper input').trigger('configure', {
                fgColor: timerBaseColor
            });
        }

        function syncDialSizeToContainer() {
            var dialContainer = document.getElementById("countdown1");
            if (!dialContainer) {
                return;
            }
            var side = Math.max(220, Math.floor(Math.min(dialContainer.clientWidth, dialContainer.clientHeight)));
            $('#countdown1 .ClassyCountdown-wrapper input').trigger('configure', {
                width: side,
                height: side
            }).trigger('change');
        }

                            fgColor: timerBaseColor
                        },
                        textCSS: 'font-family:\'Trebuchet MS\';font-weight:800;color:#7b6046;'
                    }
                },
                end: time
            }, flag, totaltime)
            time--;
            backuptime = time;
            if (num == 6) { time1 = time }

            if (time < 0 && time > -2) {
                document.getElementById('audio').play();
            }
        };

<!doctype html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PT TIMER</title>

    <link rel="stylesheet" type="text/css" href="css/default.css">

    <script src="js/jquery.min.js"></script>
    <script src="js/jquery.knob.js"></script>
    <script src="js/jquery.throttle.js"></script>
    <script src="js/jquery.classycountdown.js"></script>
    <script src="title.js"></script>

    <link rel="stylesheet" type="text/css" href="css/jquery.classycountdown.css" />

    <style>
        /* Theme Embed API: 只改这里即可整体换色 */
        :root {
            --theme-bg: #ffffff; /* 主背景色，应用于整个页面背景 */
            --theme-bg-soft: #f5f5f5; /* 次背景色，用于分隔区域和较大块的背景 */
            --theme-surface: #ffffff; /* 主要表面色，用于卡片、面板等 */
            --theme-surface-muted: #f7f7f7; /* 次表面色，用于输入框、按钮等 */
            --theme-text: #111111; /* 主要文本色，用于标题、正文等 */
            --theme-text-muted: #555555; /* 次文本色，用于辅助信息、标签等 */
            --theme-border: #cfcfcf; /* 常规边框色，用于分隔线、输入框边框等 */
            --theme-border-strong: #9a9a9a; /* 强调边框色，用于标题框、重要按钮等 */
            --theme-shadow: rgba(0, 0, 0, 0.1); /* 阴影色，用于卡片、面板等的阴影效果 */
            --theme-button: #f0f0f0; /* 按钮背景色，用于主要操作按钮 */
            --theme-button-hover: #e2e2e2; /* 按钮悬停背景色，用于主要操作按钮的悬停效果 */
            --theme-divider: #bdbdbd; /* 分隔线色，用于不同区域之间的分隔 */
            --theme-dial-active: #1e66d0; /* 定时圆盘活动色，用于剩余时间的圆盘显示 */
            --theme-dial-danger: #ff0000; /* 定时圆盘警告色，用于时间快结束时的圆盘显示 */

            --bg: var(--theme-bg); 
            --bg-soft: var(--theme-bg-soft);
            --panel: var(--theme-surface);
            --line: var(--theme-border);
            --line-strong: var(--theme-border-strong);
            --text-main: var(--theme-text);
            --text-soft: var(--theme-text-muted);
            --accent: #444444;
            --accent-deep: #222222;

            --panel-edge: rgba(0, 0, 0, 0.2);
            --panel-shadow: 0 10px 24px var(--theme-shadow);
            --timer-size: clamp(460px, 68vh, 760px);
            --main-height: 60vh;
            --app-gap: clamp(10px, 1.4vw, 16px);

            /* 背景渐变色系 */
            --bg-grad-white-55: rgba(255, 255, 255, 0.96);
            --bg-grad-white-0: rgba(255, 255, 255, 0);
            --bg-grad-circle-5: rgba(0, 0, 0, 0.04);
            --bg-grad-circle-0: rgba(0, 0, 0, 0);
            --bg-grad-1: #ffffff;
            --bg-grad-2: #f7f7f7;
            --bg-grad-3: #efefef;

            /* 标题区域色系 */
            --title-bg-1: rgba(255, 255, 255, 0.98);
            --title-bg-2: rgba(245, 245, 245, 0.98);
            --title-stripe-1: rgba(0, 0, 0, 0.04);
            --title-shadow-inner: rgba(255, 255, 255, 0.96);
            --title-shadow-outer: rgba(0, 0, 0, 0.1);

            --btn-edit-bg: var(--theme-button);
            --btn-edit-shadow: rgba(0, 0, 0, 0.25);

            /* 中部区域色系 */
            --zone-bg-1: rgba(255, 255, 255, 0.92);
            --zone-bg-2: rgba(255, 255, 255, 0.98);
            --zone-bg-3: rgba(245, 245, 245, 0.98);
            --zone-shadow-inner: rgba(255, 255, 255, 0.96);
            --zone-header-border: rgba(0, 0, 0, 0.18);

            /* 定时圆盘与剩余时间色系 */
            --dial-bg-circle: rgba(0, 0, 0, 0.06);
            --dial-bg-circle-0: rgba(0, 0, 0, 0);
            --dial-gauge-bg: rgba(0, 0, 0, 0.18);
            --dial-gauge-fg: var(--theme-dial-active);

            --time-bg-circle: rgba(0, 0, 0, 0.06);
            --time-bg-circle-0: rgba(0, 0, 0, 0);
            --time-bg-1: rgba(255, 255, 255, 0.95);
            --time-bg-2: rgba(244, 244, 244, 0.95);
            --btn-pause-bg: var(--theme-button);

            /* 分隔线色系 */
            --sep-grad-1: rgba(0, 0, 0, 0);
            --sep-grad-2: rgba(0, 0, 0, 0.45);
            --sep-grad-3: rgba(0, 0, 0, 0.55);
            --sep-rep-1: rgba(248, 248, 248, 0.95);
            --sep-rep-1-90: rgba(248, 248, 248, 0.98);
            --sep-rep-2: rgba(230, 230, 230, 0.95);
            --sep-rep-2-90: rgba(230, 230, 230, 0.98);
            --sep-shadow: rgba(0, 0, 0, 0.2);

            /* 右侧与手动面板色系 */
            --right-circle: rgba(0, 0, 0, 0.06);
            --right-circle-0: rgba(0, 0, 0, 0);
            --man-bg: #f7f7f7;
            --man-shadow: rgba(0, 0, 0, 0.12);
            --man-border: #b8b8b8;
            --man-input: #ffffff;
            --man-btn: var(--theme-button);
            --man-btn-hover: var(--theme-button-hover);

            /* 底部环节按钮色系 */
            --stage-bg-1: rgba(255, 255, 255, 0.9);
            --stage-bg-2: rgba(243, 243, 243, 0.94);
            --stage-border: rgba(0, 0, 0, 0.18);
            --stage-btn: #f0f0f0;
            --stage-btn-shadow: rgba(0, 0, 0, 0.1);
            --stage-line-1: rgba(0, 0, 0, 0);
            --stage-line-2: rgba(0, 0, 0, 0.55);
            --stage-btn-hover: #e4e4e4;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            color: var(--text-main);
            background:
                radial-gradient(circle at 20% 20%, var(--bg-grad-white-55), var(--bg-grad-white-0) 38%),
                radial-gradient(circle at 85% 8%, var(--bg-grad-circle-5), var(--bg-grad-circle-0) 42%),
                linear-gradient(135deg, var(--bg-grad-1) 0%, var(--bg-grad-2) 46%, var(--bg-grad-3) 100%);
            overflow-x: hidden;
            overflow-y: hidden;
        }

        * {
            box-sizing: border-box;
            font-family: "Trebuchet MS", "Segoe UI", "Arial Black", sans-serif;
            font-weight: 800 !important;
            letter-spacing: 0.02em;
        }

        .app {
            height: calc(100vh - 20px);
            display: grid;
            grid-template-rows: 20vh 60vh 20vh;
            gap: 0;
            padding: var(--app-gap);
            position: relative;
            margin-bottom: 20px;
        }

        .corner-logo {
            position: absolute;
            top: var(--app-gap);
            right: var(--app-gap);
            z-index: 6;
            width: min(306px, 22.5vw);
            height: min(clamp(80px, 14vh, 150px), calc(20vh - (var(--app-gap) * 2)));
            pointer-events: none;
            display: flex;
            align-items: flex-start;
            justify-content: flex-end;
        }

        .corner-logo img {
            width: auto;
            max-width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
        }

        .title-section {
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            padding: 10px 0;
            min-height: 0;
            overflow: hidden;
        }

        .title-row {
            display: flex;
            align-items: stretch;
            gap: clamp(8px, 1vw, 14px);
            max-width: calc(100% - min(270px, 20vw));
            flex-wrap: nowrap;
            min-width: 0;
        }

        .title-frame {
            width: fit-content;
            max-width: 58vw;
            border-radius: 22px;
            border: 2px solid var(--line-strong);
            background:
                linear-gradient(130deg, var(--title-bg-1), var(--title-bg-2)),
                repeating-linear-gradient(-45deg, var(--title-stripe-1), var(--title-stripe-1) 8px, var(--bg-grad-white-0) 8px, var(--bg-grad-white-0) 18px);
            box-shadow:
                inset 0 1px 0 var(--title-shadow-inner),
                0 12px 30px var(--title-shadow-outer);
            padding: clamp(14px, 1.7vw, 20px) clamp(16px, 2vw, 28px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            flex-wrap: nowrap;
            min-height: clamp(80px, 14vh, 150px);
        }

        /* 移除文本溢出省略号，彻底交给 ResizeObserver 处理 */
        #output {
            color: var(--text-main);
            user-select: none;
            line-height: 1;
            text-align: center;
            white-space: nowrap;
            text-transform: uppercase;
            font-size: 96px; /* 初始最大值 */
            text-shadow: 0 2px 0 var(--title-shadow-inner);
            padding: 0 clamp(10px, 1.2vw, 18px);
            overflow: hidden;
        }

        .top-section-frame {
            max-width: 30vw;
            min-height: clamp(80px, 14vh, 150px);
            padding: clamp(14px, 1.7vw, 20px) clamp(16px, 2vw, 28px);
            border-radius: 22px;
            border: 2px solid var(--line-strong);
            background: linear-gradient(130deg, var(--title-bg-1), var(--title-bg-2));
            box-shadow: inset 0 1px 0 var(--title-shadow-inner), 0 12px 30px var(--title-shadow-outer);
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            min-width: 0;
        }

        #top-section-name {
            font-size: 96px;
            line-height: 1;
            text-transform: uppercase;
            padding: 0 clamp(10px, 1.2vw, 18px);
            overflow: hidden;
        }

        #edit-title-btn {
            border: 2px solid var(--line-strong);
            border-radius: 16px;
            background: var(--btn-edit-bg);
            color: var(--text-main);
            cursor: pointer;
            text-transform: none;
            padding: 8px 6px;
            width: clamp(56px, 4.6vw, 76px);
            min-height: clamp(80px, 14vh, 150px);
            font-size: clamp(18px, 1.65vw, 26px);
            line-height: 1;
            writing-mode: vertical-rl;
            text-orientation: upright;
            letter-spacing: 0.03em;
            box-shadow: 0 3px 0 var(--btn-edit-shadow);
            transition: transform 0.14s ease, box-shadow 0.14s ease;
        }

        #edit-title-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 0 var(--btn-edit-shadow);
        }

        .main-panel {
            min-height: 0;
            height: 100%;
            overflow: hidden;
            display: grid;
            grid-template-columns: minmax(340px, 1.28fr) 16px minmax(240px, 0.9fr) 16px minmax(290px, 1fr);
            gap: clamp(8px, 1vw, 14px);
            align-items: stretch;
        }

        .zone {
            position: relative;
            min-width: 0;
            border-radius: 20px;
            background:
                radial-gradient(circle at 12% 14%, var(--zone-bg-1), var(--bg-grad-white-0) 44%),
                linear-gradient(180deg, var(--zone-bg-2), var(--zone-bg-3));
            border: 1px solid var(--panel-edge);
            box-shadow: inset 0 1px 0 var(--zone-shadow-inner), var(--panel-shadow);
            min-height: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .zone-header {
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid var(--zone-header-border);
            padding: 0 12px;
            min-height: 0;
            height: 15%;
            flex: 0 0 15%;
        }

        .zone-header-label {
            font-size: clamp(16px, 2.4vw, 40px);
            color: var(--text-soft);
            text-transform: uppercase;
            line-height: 1;
            opacity: 0.95;
            text-align: center;
            width: 100%;
        }

        .zone-inner {
            height: 100%;
            min-height: 0;
            flex: 1 1 auto;
        }

        .zone-dial {
            display: grid;
            grid-template-rows: 1fr;
            grid-template-columns: clamp(64px, 15%, 130px) 1fr;
            align-items: center;
            gap: 0;
        }

        .zone-dial .zone-header {
            height: 100%;
            flex: none;
            border-bottom: none;
            border-right: none;
            padding: 0 0 0 clamp(2px, 0.4vw, 8px);
            justify-content: flex-start;
        }

        .zone-dial .zone-header-label {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: clamp(38px, 5.1vw, 86px);
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: flex-start;
            width: auto;
            opacity: 0.98;
        }

        .dial-side-name {
            margin-left: clamp(0px, 0.2vw, 4px);
            letter-spacing: 0;
        }

        .timer-panel {
            width: 100%;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: clamp(2px, 0.4vw, 8px);
        }

        .ClassyCountdownDemo {
            width: min(100%, 70%);
            max-width: 100%;
            height: min(70%, var(--timer-size));
            aspect-ratio: 1 / 1;
            margin: 0;
            padding: 0;
            border-radius: 20px;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, var(--dial-bg-circle), var(--dial-bg-circle-0) 70%);
        }

        #countdown1 .ClassyCountdown-wrapper {
            width: 100% !important;
            height: 100% !important;
            position: relative;
        }

        #countdown1 .ClassyCountdown-wrapper>div {
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
        }

        #countdown1 .ClassyCountdown-wrapper .ClassyCountdown-time,
        #countdown1 .ClassyCountdown-wrapper .ClassyCountdown-minutes {
            display: none !important;
        }

        .zone-time {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: clamp(7px, 1.2vh, 12px);
            padding: clamp(8px, 1vw, 12px) clamp(16px, 2vw, 24px);
            text-align: center;
            background:
                radial-gradient(circle at 18% 20%, var(--time-bg-circle), var(--time-bg-circle-0) 45%),
                linear-gradient(180deg, var(--time-bg-1), var(--time-bg-2));
        }

        .time-left-label {
            color: var(--text-soft);
            font-size: clamp(32px, 3.1vw, 52px);
            line-height: 1.1;
            text-transform: uppercase;
        }

        #time-left-value {
            color: var(--text-main);
            font-size: clamp(54px, min(7.2vw, 11.6vh), 144px);
            line-height: 0.95;
            text-transform: uppercase;
            white-space: nowrap;
            text-shadow: 0 2px 0 var(--title-shadow-inner);
            max-width: 100%;
            overflow: hidden;
            text-overflow: clip;
        }

        #time-pause-btn {
            min-width: clamp(120px, 12vw, 190px);
            height: clamp(42px, 5.4vh, 56px);
            border-radius: 12px;
            border: 1px solid var(--line-strong);
            background: var(--btn-pause-bg);
            color: var(--text-main);
            font-size: clamp(19px, 1.8vw, 30px);
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--btn-edit-shadow);
        }

        #time-pause-btn:hover {
            transform: translateY(-1px);
        }

        .v-separator {
            align-self: stretch;
            width: 100%;
            border-radius: 999px;
            background:
                linear-gradient(180deg, var(--sep-grad-1) 0%, var(--sep-grad-2) 14%, var(--sep-grad-2) 86%, var(--sep-grad-1) 100%),
                repeating-linear-gradient(180deg, var(--sep-rep-1), var(--sep-rep-1) 5px, var(--sep-rep-2) 5px, var(--sep-rep-2) 10px);
            box-shadow: 0 0 0 1px var(--sep-shadow);
        }

        .right-panel {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: center;
            gap: clamp(8px, 1.2vh, 12px);
            padding: clamp(10px, 1.2vw, 14px);
            background:
                radial-gradient(circle at 78% 14%, var(--right-circle), var(--right-circle-0) 40%),
                linear-gradient(180deg, var(--time-bg-1), var(--time-bg-2));
        }

        .manual-panel {
            width: 100%;
            max-width: 100%;
            border-radius: 14px;
            border: 1px solid var(--line-strong);
            background: var(--man-bg);
            box-shadow: 0 8px 20px var(--man-shadow);
            padding: clamp(10px, 1vw, 14px);
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: clamp(6px, 0.8vw, 10px);
        }

        /* 移除强制宽高比和定高，赋予弹性的最小高度 */
        .manual-panel input,
        .manual-panel button {
            width: 100%;
            min-height: 50px;
            height: clamp(50px, 10.5vh, 124px);
            border-radius: 10px;
            border: 1px solid var(--man-border);
            color: var(--text-main);
            background: var(--man-input);
            font-size: clamp(16px, 2.2vw, 36px);
            text-align: center;
            text-transform: uppercase;
            line-height: 1;
            padding: 2px;
        }

        .manual-panel input[type="number"] {
            padding-right: 0.22em;
        }

        .manual-panel input[type="number"]::-webkit-outer-spin-button,
        .manual-panel input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: inner-spin-button;
            opacity: 1;
            height: 100%;
            width: 1.42em;
            margin: 0;
            transform: scale(1.28);
            transform-origin: center;
        }

        .manual-panel button {
            cursor: pointer;
            background: var(--man-btn);
        }

        .manual-panel button:hover {
            background: var(--man-btn-hover);
        }

        .stages {
            min-height: 0;
            height: 100%;
            overflow: hidden;
            display: grid;
            grid-template-columns: repeat(7, minmax(130px, 1fr));
            gap: clamp(6px, 0.8vw, 10px);
            align-items: stretch;
            padding-top: clamp(8px, 1vh, 12px);
            padding-bottom: clamp(8px, 1vh, 12px);
            border-radius: 16px;
            background: linear-gradient(180deg, var(--stage-bg-1), var(--stage-bg-2));
            border: 1px solid var(--stage-border);
        }

        /* 允许文字自然换行 */
        .stage-btn {
            position: relative;
            min-height: 0;
            height: 100%;
            border-radius: 10px;
            border: 1px solid var(--line-strong);
            background: var(--stage-btn);
            color: var(--text-main);
            font-size: clamp(14px, 2.5vh, 30px);
            line-height: 1.1;
            text-align: center;
            padding: 4px;
            cursor: pointer;
            box-shadow: 0 3px 8px var(--stage-btn-shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            white-space: nowrap;
        }

        .stage-btn::after {
            content: "";
            position: absolute;
            top: 16%;
            right: -8px;
            width: 2px;
            height: 68%;
            border-radius: 99px;
            background: linear-gradient(180deg, var(--stage-line-1), var(--stage-line-2) 20%, var(--stage-line-2) 80%, var(--stage-line-1));
        }

        .stages .stage-btn:last-child::after {
            display: none;
        }

        .stage-btn:hover {
            transform: translateY(-1px);
            background: var(--stage-btn-hover);
        }

        @media (max-width: 1420px) {
            :root {
                --timer-size: clamp(330px, 52vh, 560px);
            }

            .main-panel {
                grid-template-columns: minmax(320px, 1.2fr) 14px minmax(220px, 0.86fr) 14px minmax(260px, 0.95fr);
            }

            .title-row {
                max-width: calc(100% - min(220px, 18vw));
            }

            .stages {
                grid-template-columns: repeat(5, minmax(120px, 1fr));
            }
        }

        /* 优化移动端 Grid布局 */
        @media (max-width: 1080px) {
            .main-panel {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .app {
                height: auto;
                min-height: 100vh;
                grid-template-rows: auto auto auto;
                margin-bottom: 20px;
            }

            body {
                overflow-y: auto;
            }

            .corner-logo {
                position: static;
                width: min(306px, 67.5vw);
                margin: 0 auto;
                pointer-events: auto;
            }

            .corner-logo img {
                width: 100%;
                height: min(clamp(88px, 12vh, 130px), calc(20vh - 20px));
                object-position: center;
            }

            .title-frame {
                width: fit-content;
            }

            .title-row {
                max-width: 100%;
                flex-wrap: wrap;
            }

            #edit-title-btn {
                writing-mode: horizontal-tb;
                text-orientation: mixed;
                width: auto;
                min-height: 44px;
                padding: 8px 14px;
                border-radius: 12px;
                letter-spacing: 0.03em;
                font-size: clamp(14px, 2vw, 18px);
            }

            .v-separator {
                width: 100%;
                height: 12px;
                background:
                    linear-gradient(90deg, var(--sep-grad-1) 0%, var(--sep-grad-3) 10%, var(--sep-grad-3) 90%, var(--sep-grad-1) 100%),
                    repeating-linear-gradient(90deg, var(--sep-rep-1-90), var(--sep-rep-1-90) 6px, var(--sep-rep-2-90) 6px, var(--sep-rep-2-90) 12px);
            }

            .timer-panel {
                width: min(95vw, 540px);
            }

            .zone-dial {
                grid-template-columns: 1fr;
                grid-template-rows: 15% 85%;
            }

            .zone-dial .zone-header {
                justify-content: center;
                border-right: none;
                border-bottom: 1px solid var(--zone-header-border);
                padding: 0 8px;
            }

            .zone-dial .zone-header-label {
                writing-mode: horizontal-tb;
                font-size: clamp(18px, 4vw, 26px);
                width: 100%;
                justify-content: center;
            }

            #time-left-value {
                font-size: clamp(56px, 13vw, 128px);
            }

            .right-panel {
                flex-direction: column;
                justify-content: center;
            }

            .manual-panel {
                max-width: 440px;
                margin: 0 auto;
            }

            .stages {
                grid-template-columns: repeat(4, minmax(120px, 1fr));
            }
        }

        @media (max-width: 700px) {
            .app {
                padding: 10px;
            }

            .title-frame {
                border-radius: 16px;
            }

            .zone-header-label {
                font-size: clamp(18px, 4vw, 26px);
            }

            #output {
                font-size: clamp(30px, 9vw, 56px);
                white-space: normal;
            }

            .manual-panel {
                grid-template-columns: 1fr;
            }

            .stages {
                grid-template-columns: repeat(2, minmax(130px, 1fr));
            }

            .stage-btn::after {
                display: none;
            }
        }
    </style>
    </head>

<body>
    <div class="app">
        <!-- NJU logo removed per request -->

        <header class="title-section">
            <div class="title-row">
                <button id="edit-title-btn" type="button">修改标题</button>
                <div class="title-frame">
                    <div id="output" data-title-file="title.txt"></div>
                </div>
                <div class="top-section-frame">
                    <div id="top-section-name" class="sector-name">READY</div>
                </div>
            </div>
        </header>

        <section class="main-panel">
            <div class="zone zone-dial">
                <div class="zone-header">
                    <span class="zone-header-label sector-name dial-side-name">READY</span>
                </div>
                <div class="zone-inner timer-panel">
                    <div id="countdown1" class="ClassyCountdownDemo" aria-label="Main Countdown Dial"></div>
                </div>
            </div>

            <div class="v-separator" aria-hidden="true"></div>

            <div class="zone zone-time">
                <div class="zone-inner zone-time">
                    <div class="time-left-label">TIME LEFT</div>
                    <div id="time-left-value">00 : 00</div>
                    <button id="time-pause-btn" type="button">START</button>
                </div>
            </div>

            <div class="v-separator" aria-hidden="true"></div>

            <aside class="zone zone-extra">
                <div class="zone-inner right-panel">
                    <div class="manual-panel">
                        <input type="number" name="minutes" id="min" placeholder="分" />
                        <input type="number" name="seconds" id="sec" placeholder="秒" />
                        <button id="start">开始</button>
                        <button id="recover">重置</button>
                        <button id="next" style="grid-column: span 2;">下一环节</button>
                    </div>
                </div>
            </aside>
        </section>

        <section class="stages">
            <button id="bt2" class="stage-btn">准备环节 (1')</button>
            <button id="bt3" class="stage-btn">正方报告 (12')</button>
            <button id="bt4" class="stage-btn">反方提问 (3')</button>
            <button id="bt6" class="stage-btn">反方报告 (3')</button>
            <button id="bt7" class="stage-btn">正反方讨论 (10')</button>
            <button id="bt8" class="stage-btn">评论方提问 (3')</button>
            <button id="bt9" class="stage-btn">评论方准备 (2')</button>
            <button id="bt10" class="stage-btn">评论方报告 (4')</button>
            <button id="bt11" class="stage-btn">正方总结 (1')</button>
            <button id="bt12" class="stage-btn">评分 (2')</button>
            <button id="bt13" class="stage-btn">裁判点评 (5')</button>
        </section>
    </div>

    <audio src="song.mp3" id="audio"></audio>

    <script type="text/javascript">
        "use strict";

        // 全局状态机引擎
        var state = 'IDLE'; // 状态枚举：IDLE, RUNNING, PAUSED
        var endTime = 0;
        var pausedTimeLeft = 0;
        var totalTime = 1;
        var intervalId = null;
        var num = 0;
        var currentStageName = "准备阶段";
        var currentStageDuration = 0;
        var time1 = 0; // 反方报告结余时间
        var lastRenderedSecond = -1;

        // 获取 CSS 变量协助绘图
        function getCssVariable(variableName) {
            return getComputedStyle(document.documentElement).getPropertyValue(variableName).trim();
        }

        function setOutputText(rawText) {
            var output = document.getElementById("output");
            if (!output) return;
            var text = (rawText || "").toString().replace(/\r/g, "").replace(/\n+/g, "").replace(/<[^>]+>/g, "").trim();
            output.textContent = text || "CUPT交流赛";
            applyDynamicTextFit();
        }

        function loadInitialTitle() {
            var text = window.APP_TITLE_TEXT || "CUPT交流赛";
            setOutputText(text);
        }

        // 引入 ResizeObserver Text Fit 算法解决溢出
        function applyDynamicTextFit() {
            var elements = [document.getElementById('output'), document.getElementById('top-section-name')];
            var minSize = 96; // 初始最大值

            // 第一阶段：找出能让他们都显示得下的最小字号
            elements.forEach(function(el) {
                if (!el || !el.parentElement) return;

                el.style.fontSize = '96px';
                
                var parent = el.parentElement;
                var parentStyle = window.getComputedStyle(parent);
                var maxContentW = parent.clientWidth 
                    - parseFloat(parentStyle.paddingLeft || 0) 
                    - parseFloat(parentStyle.paddingRight || 0);

                var elStyle = window.getComputedStyle(el);
                var elPadding = parseFloat(elStyle.paddingLeft || 0) + parseFloat(elStyle.paddingRight || 0);
                var targetW = maxContentW - elPadding;

                var span = document.createElement('span');
                span.style.fontFamily = elStyle.fontFamily;
                span.style.fontWeight = elStyle.fontWeight;
                span.style.letterSpacing = elStyle.letterSpacing;
                span.style.textTransform = elStyle.textTransform;
                span.style.position = 'absolute';
                span.style.visibility = 'hidden';
                span.style.whiteSpace = 'nowrap';
                span.textContent = el.textContent;
                document.body.appendChild(span);

                var currentSize = 96;
                while (currentSize > 12) {
                    span.style.fontSize = currentSize + 'px';
                    if (span.offsetWidth <= targetW) {
                        break;
                    }
                    currentSize -= 2;
                }
                
                document.body.removeChild(span);
                
                if (currentSize < minSize) {
                    minSize = currentSize;
                }
            });

            // 第二阶段：将计算出的最小字号同时应用到两者，保证同一大小并完整显示
            elements.forEach(function(el) {
                if (el) {
                    el.style.fontSize = minSize + 'px';
                }
            });
        }

        function updateTimeLeftDisplay(totalSeconds) {
            var valueNode = document.getElementById("time-left-value");
            if (!valueNode) return;
            var safeValue = Math.max(0, Number(totalSeconds) || 0);
            var minutes = Math.floor(safeValue / 60);
            var seconds = safeValue % 60;
            valueNode.textContent = (minutes < 10 ? "0" + minutes : minutes) + " : " + (seconds < 10 ? "0" + seconds : seconds);
        }

        function setSectorName(rawText) {
            var text = (rawText || "").toString().replace(/\r/g, "").replace(/\n+/g, "").replace(/<[^>]+>/g, "").trim();
            $(".sector-name").text(text || "准备阶段");
            applyDynamicTextFit();
        }

        // 控制 UI 显示 START / PAUSE / RESUME
        function updatePauseButtonState() {
            var label = "开始";
            if (state === 'RUNNING') label = "暂停";
            else if (state === 'PAUSED') label = "继续";
            $("#time-pause-btn").text(label);
        }

        function syncDialSizeToContainer() {
            var dialContainer = document.getElementById("countdown1");
            if (!dialContainer) return;
            var side = Math.max(220, Math.floor(Math.min(dialContainer.clientWidth, dialContainer.clientHeight)));
            $('#countdown1 .ClassyCountdown-wrapper input').trigger('configure', {
                width: side,
                height: side
            }).trigger('change');
        }

        // ================= 核心定时引擎 (Date.now()时间戳相减) =================
        function startTimer(durationSeconds) {
            if (intervalId) clearInterval(intervalId);
            totalTime = durationSeconds;
            endTime = Date.now() + durationSeconds * 1000;
            state = 'RUNNING';
            
            updateTimeLeftDisplay(durationSeconds);
            
            var styleConfig = getDialStyle();
            
            // 强制重新初始化圆盘上限 (flag 1)
            $('#countdown1').ClassyCountdown({
                theme: "theme1",
                style: styleConfig,
                end: durationSeconds
            }, 1, totalTime);
            
            // 修复原生插件在 flag=1 时强行写死 #2980b9 的问题，强制恢复配置颜色
            $('#countdown1 .ClassyCountdown-wrapper input').trigger('configure', {
                fgColor: styleConfig.seconds.gauge.fgColor
            });
            
            lastRenderedSecond = durationSeconds;
            updatePauseButtonState();
            
            // 使用200ms的高频扫描避免漏刷，但不改变时间计算的精准性
            intervalId = setInterval(tick, 200);
        }

        function getDialStyle() {
            return {
                element: '',
                textResponsive: 2,
                seconds: {
                    gauge: {
                        thickness: 1,
                        bgColor: getCssVariable('--dial-gauge-bg') || "rgba(118,88,60,0.18)",
                        fgColor: getCssVariable('--dial-gauge-fg') || "#1e66d0"
                    },
                    textCSS: 'display:none;'
                }
            };
        }

        function tick() {
            if (state !== 'RUNNING') return;
            var now = Date.now();
            var timeLeft = Math.ceil((endTime - now) / 1000);

            if (timeLeft <= 0) {
                timeLeft = 0;
                if (state === 'RUNNING') {
                    // 仅在真实归零的那一刻响铃，避免初始挂载Bug
                    document.getElementById('audio').play().catch(function(e){});
                }
                state = 'IDLE';
                clearInterval(intervalId);
                updatePauseButtonState();
            }

            if (num === 6) { time1 = timeLeft; } // 反方报告时间记录

            // 只有当秒数改变时才重绘，节约性能
            if (timeLeft !== lastRenderedSecond) {
                lastRenderedSecond = timeLeft;
                updateTimeLeftDisplay(timeLeft);
                // 更新圆盘 (flag 2)
                $('#countdown1').ClassyCountdown({
                    theme: "theme1",
                    style: getDialStyle(),
                    end: timeLeft
                }, 2, totalTime);
            }
        }

        // ================= 全局暂停/恢复 控制流 =================
        function togglePauseState() {
            if (state === 'RUNNING') {
                var now = Date.now();
                pausedTimeLeft = Math.ceil((endTime - now) / 1000);
                if (pausedTimeLeft < 0) pausedTimeLeft = 0;
                state = 'PAUSED';
                clearInterval(intervalId);
            } else if (state === 'PAUSED' || state === 'IDLE') {
                if (state === 'IDLE' && pausedTimeLeft <= 0) return; // 无剩余时间不可继续
                endTime = Date.now() + pausedTimeLeft * 1000;
                state = 'RUNNING';
                lastRenderedSecond = -1; // 强制刷新
                intervalId = setInterval(tick, 200);
            }
            updatePauseButtonState();
        }

        // 统一提取载入阶段辅助逻辑，消除冗余
        function loadStage(stageNum, durationMinutes, stageName) {
            num = stageNum;
            var finalSeconds = durationMinutes * 60;

            // 特殊业务：环节 7 累加环节 6 剩余时间
            if (num === 7 && time1 > 0) {
                finalSeconds += time1;
                time1 = 0; // 消耗后清空
            }
            
            currentStageName = stageName;
            currentStageDuration = finalSeconds;

            setSectorName(stageName);
            startTimer(finalSeconds);
            syncDialSizeToContainer();
        }

        $(document).ready(function () {
            // ResizeObserver 接管大小调整
            var ro = new ResizeObserver(function() {
                applyDynamicTextFit();
                syncDialSizeToContainer();
            });
            ro.observe(document.body);

            loadInitialTitle();
            updateTimeLeftDisplay(0);
            setSectorName("准备阶段");
            updatePauseButtonState();

            // 初始化默认的空圆盘 (使用 flag=0 让插件初次构建 DOM)
            $('#countdown1').ClassyCountdown({
                theme: "theme1",
                style: getDialStyle(),
                end: 0
            }, 0, 1);
            syncDialSizeToContainer();

            $("#edit-title-btn").click(function () {
                var currentTitle = $("#output").text().trim() || "CUPT交流赛";
                var changed = window.prompt("请输入新的比赛标题", currentTitle);
                if (changed !== null && changed.trim() !== "") {
                    setOutputText(changed);
                }
            });

            // 阶段按钮调用统一辅助函数
            $("#bt2").click(function () { loadStage(2, 1, "准备环节"); });
            $("#bt3").click(function () { loadStage(3, 12, "正方报告"); });
            $("#bt4").click(function () { loadStage(4, 3, "反方提问"); });
            $("#bt6").click(function () { loadStage(6, 3, "反方报告"); });
            $("#bt7").click(function () { loadStage(7, 10, "正反方讨论"); });
            $("#bt8").click(function () { loadStage(8, 3, "评论方提问"); });
            $("#bt9").click(function () { loadStage(9, 2, "评论方准备"); });
            $("#bt10").click(function () { loadStage(10, 4, "评论方报告"); });
            $("#bt11").click(function () { loadStage(11, 1, "正方总结"); });
            $("#bt12").click(function () { loadStage(12, 2, "评分"); });
            $("#bt13").click(function () { loadStage(13, 5, "裁判点评"); });

            // 彻底去除 Eval 的安全执行方式
            $("#next").click(function () {
                var num1 = num + 1;
                // 循环查找下一个存在的按钮，支持移除/合并按钮的情况
                for (var i = 0; i < 13; i++) {
                    if (num1 > 13) num1 = 1;
                    var el = document.getElementById("bt" + num1);
                    if (el) { el.click(); break; }
                    num1++;
                }
            });

            $("#recover").click(function () {
                if (currentStageDuration > 0) {
                    setSectorName(currentStageName);
                    startTimer(currentStageDuration);
                    syncDialSizeToContainer();
                }
            });

            $("#start").click(function () {
                var m = parseInt($("#min").val()) || 0;
                var s = parseInt($("#sec").val()) || 0;
                var total = m * 60 + s;
                if (total > 0) {
                    num = 0;
                    currentStageName = "手动模式";
                    currentStageDuration = total;
                    setSectorName("手动模式");
                    startTimer(total);
                }
            });

            $("#time-pause-btn").click(function () {
                togglePauseState();
            });

            // 使用现代 API 绑定按键
            window.addEventListener('keydown', function (e) {
                if (e.key.toLowerCase() === 'z' && e.target.tagName !== 'INPUT') {
                    document.getElementById('next').click();
                }
            });
        });

    </script>
</body>

</html>
